<footer class="bg-light dark:bg-darkmode-light">
  <div class="container">
    <div class="row items-center py-10">
      <div class="lg:col-3 mb-8 text-center lg:mb-0 lg:text-left">
        <!-- navbar brand/logo -->
        <a
          class="navbar-brand inline-block"
          href="{{ site.Home.RelPermalink }}">
          {{ partial "logo" }}
        </a>
      </div>
      <div class="lg:col-6 mb-8 text-center lg:mb-0">
        <ul>
          {{ range site.Menus.footer }}
            <li class="m-3 inline-block underline-text">
              <a
                {{ if findRE `^http` .URL }}
                  target="_blank" rel="noopener"
                {{ end }}
                href="{{ if findRE `^#` .URL }}
                  {{ if not $.IsHome }}
                    {{ site.Home.RelPermalink }}
                  {{ end }}{{ .URL }}
                {{ else }}
                  {{ .URL | relLangURL }}
                {{ end }}"
                >{{ .Name }}</a
              >
            </li>
          {{ end }}
        </ul>
      </div>
      <div class="lg:col-3 mb-8 text-center lg:mb-0 lg:mt-0 lg:text-right">
        <ul class="social-icons">
          {{ range site.Data.social.main }}
            <li>
              <a
                target="_blank"
                aria-label="{{ .name }}"
                rel="nofollow noopener"
                href="{{ .link | safeURL }}">
                <i class="{{ .icon }}"></i>
              </a>
            </li>
          {{ end }}
        </ul>
      </div>
    </div>
  </div>
  <div class="container text-center">
    <small class="text-neutral-50 underline-text">
      {{ site.Params.copyright | markdownify }} &copy; {{ now.Format "2006" }} Allemagne pratique
    </small>
    <ul class="mt-4 flex items-center justify-center">
      <li class="px-4">
         <a
          class="navbar-brand inline-block"
          href="https://actionpopulaire.fr/groupes/3db3e34b-d05e-436a-bc64-de64aa87cd0f/" target="_blank">
         <img class="w-[66px] h-auto" src="/images/logo-berlin-insoumise.png" alt="logo Groupe d'action Berlin Insoumise">
        </a>
        </li>
        <li class="px-4">
         <a
          class="navbar-brand inline-block"
          href="https://lafranceinsoumise.fr/" target="_blank">
          <img class="w-[100px] h-auto" src="/images/logo-lfi.png" alt="logo LFI">
        </a>
      </li>
    </ul>
  </div>
</footer>
<script src="{{ "js/scroll-spy.js" | relURL }}"></script>
