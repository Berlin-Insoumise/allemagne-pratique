name: Deploy website

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build static files with Hugo
    container: hugomods/hugo:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: true  # Ensure Hugo themes are checked out if they are submodules

      - name: Build website with Hugo
        run: hugo --minify

      - name: Upload built site as artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: public/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    name: Deploy to FTP server
    needs: build

    steps:

    - name: checkout branch
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0
        submodules: true

    - name: Download static build
      uses: actions/download-artifact@v4
      with:
        name: static-site
        path: public

    - name: install lftp
      run: echo "set man-db/auto-update false" | sudo debconf-communicate && sudo dpkg-reconfigure man-db && sudo apt-get install -y lftp

    - name: mirror local build/ with remote www/
      run: bash rsync_ftp.bash ${{ secrets.FTP_USER }} ${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }} ./public /www 4
