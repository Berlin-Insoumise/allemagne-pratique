name: Deploy website

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build static files with Hugo
    container: hugomods/hugo:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: true  # Ensure Hugo themes are checked out if they are submodules

      - name: Build website with Hugo
        run: hugo --minify

      - name: Upload built site as artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: public/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    name: Deploy to FTP server
    needs: build

    steps:

    - name: checkout branch
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
        fetch-depth: 0
        submodules: true

    - name: Download static build
      uses: actions/download-artifact@v4
      with:
        name: static-site
        path: public

    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USER }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./public/
        server-dir: /www/
