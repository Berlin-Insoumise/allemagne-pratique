name: Build and Deploy Static Website with Hugo

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    container: hugomods/hugo:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: true  # Ensure Hugo themes are checked out if they are submodules

      - name: Build website with Hugo
        run: hugo --minify

      - name: Upload built site as artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: public

  validate:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Validate Kubernetes manifest
        uses: docker://garethr/kubeval:latest
        with:
          args: k8s/job.copy-static-files-to-pvc.yml

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    container: bitnami/kubectl:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download built site artifact
        uses: actions/download-artifact@v4
        with:
          name: static-site
          path: public

      - name: Configure KUBECONFIG
        env:
          KUBE_CONFIG: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply Kubernetes Job to copy files
        run: |
          kubectl apply -f k8s/job.copy-static-files-to-pvc.yml --validate=false

      - name: Wait for Job completion
        run: |
          kubectl wait --for=condition=complete --timeout=60s job/copy-static-files
