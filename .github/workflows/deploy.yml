name: 🚀 Deploy Website

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: 🛠️ Build and Deploy Website
    container: hugomods/hugo:latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3

      # Install Node.js (required for TailwindCSS)
      - name: 📦 Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Install TailwindCSS CLI
      - name: 🎨 Install TailwindCSS
        run: npm install tailwindcss

      - name: 🏗️ Build Static Site with Hugo
        run: hugo --gc --minify --templateMetrics --templateMetricsHints --forceSyncStatic

      - name: 🚀 Deploy to FTP Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./public/
          server-dir: /www/
