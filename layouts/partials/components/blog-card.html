
<a class="card shadow-md hover:shadow-none rounded-md flex" href="{{ .RelPermalink }}">
    <div>
        {{ $image:= .Params.image }}
        {{ if $image }}
            {{ partial "image" (dict "Src" $image "Context" .Page "Alt" .Title "Class" "w-full lg:w-[160px] h-full object-cover") }}
        {{ end }}
    </div>
    <div class="p-6">
        <h4 class="mb-1 h4">
          {{ .Title }}
        </h4>
        {{/*  <p>{{ .Summary | plainify }}</p>   */}}
    </div>
  </a>
