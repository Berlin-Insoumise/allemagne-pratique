name: Build and Deploy Static Website with Hugo

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    container: hugomods/hugo:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: true  # Ensure Hugo themes are checked out if they are submodules

      - name: Build website with Hugo
        run: hugo --minify

      - name: Upload built site as artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: public

  validate:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Validate Kubernetes manifest
        uses: docker://garethr/kubeval:latest
        with:
          args: k8s/job.copy-static-files-to-pvc.yml

  deploy:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download built site artifact
        uses: actions/download-artifact@v4
        with:
          name: static-site
          path: public

      - name: Apply Kubernetes Job to copy files
        uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        with:
          args: apply -f k8s/job.copy-static-files-to-pvc.yml --validate=false
